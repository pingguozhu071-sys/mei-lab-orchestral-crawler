name: zhihu-question
match: [zhihu.com]
item_type: qa
detail:
  fields:
    title:
      sel: "h1.Question-title, h1[topic-args]"
      text: true
    author:
      sel: ".AuthorInfo-avatar + .AuthorInfo-name, .AuthorInfo-name"
      text: true
    published:
      sel: ".ContentItem-time, .QuestionPage-header-meta"
      text: true
    content:
      sel: ".RichText-inner, .QuestionAnswers-content"
      text: true
  media:
    images:
      sel: ".RichText-inner img, .ContentItem img"
      attr: src
